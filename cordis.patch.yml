# dsh-gemini-eyes-bundle: expose gemini-web-mcp tools to DeepSeek Harness.
#
# The bundle inserts one row for the in-box @deepseek-ai/dsh-mcp-client,
# which spawns this repository's Python server over stdio. The tools then
# appear in a session as mcp__gemini-web__gemini_send_message,
# mcp__gemini-web__gemini_analyze_media, mcp__gemini-web__gemini_generate_image,
# mcp__gemini-web__gemini_generate_video, ...
#
# Zero-config path: if none of the env vars below are set, the bridge uses
# `uv` from PATH and the MCP server auto-extracts the Google session cookies
# from your local Chrome profile (browser closed, logged in to
# gemini.google.com). New-browser app-bound encryption needs a manual export.
#
# Optional env vars (set them when launching `dsh web`):
#   GEMINI_EYES_UV       absolute path to uv (default: `uv` on PATH)
#   GEMINI_EYES_DIR      absolute path to this repository checkout
#                        (default: current directory — set it unless dsh runs
#                        with this repo as its working directory)
#   GEMINI_COOKIE_FILE   absolute path to your exported cookies.json
#                        (default: auto-extract from Chrome)
- insert:
    - id: gemini-web
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: gemini-web
        transport: stdio
        # mcp-client defaults each tool call to a 60s timeout; image/video
        # analysis and video generation regularly exceed that. 10 minutes
        # matches the server-side video polling budget (600s).
        toolCallTimeoutMs: 600000
        command: !!js process.env.GEMINI_EYES_UV || 'uv'
        cwd: !!js process.env.GEMINI_EYES_DIR || ''
        env:
          GEMINI_COOKIE_FILE: !!js process.env.GEMINI_COOKIE_FILE || ''
        args:
          - run
          - gemini-mcp
